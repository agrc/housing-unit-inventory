[tool.ruff]
line-length = 120
extend-exclude = ["tests", "docs"]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [ "tests", "src" ]
norecursedirs = [".env", "data", "maps", ".github", ".vscode"]
console_output_style = "count"
addopts = "--cov-branch --cov=housing_unit_inventory --cov-report term --cov-report xml:cov.xml --instafail"
